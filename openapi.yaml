{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "MyAnime HTTP API",
    "version": "1.0.0",
    "description": "Shared desktop/web contract. JSON UTF-8, opaque IDs, RFC3339 UTC timestamps, finite nonnegative seconds. Web access needs no account and shares one local library. Desktop requests use the shell bootstrap bearer token. Mutations require X-CSRF-Token from capabilities/bootstrap; web mutations also require Origin. Media uses session-scoped capability URLs outside /api/v1. Optional metadata fields may be omitted when unknown."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "desktopBearer": []
    },
    {}
  ],
  "paths": {
