{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "MyAnime HTTP API",
    "version": "1.0.0",
    "description": "Shared desktop/web contract. JSON UTF-8, opaque IDs, RFC3339 UTC timestamps, finite nonnegative seconds. Authenticated API calls use desktop bearer OR web session cookie; cookie mutations also require Origin and X-CSRF-Token. Media uses session-scoped capability URLs outside /api/v1. Optional metadata fields may be omitted when unknown."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "desktopBearer": []
    },
    {
      "webSession": []
    }
  ],
  "paths": {
    "/api/v1/cache": {
      "delete": {
        "operationId": "clearCache",
        "description": "Deletes cached metadata and provider mappings only. Cookie authentication requires Origin and X-CSRF-Token.",
        "parameters": [
          {"name": "confirmed", "in": "query", "required": true, "schema": {"type": "boolean", "const": true}},
          {"$ref": "#/components/parameters/csrf"}
        ],
        "responses": {
          "204": {"description": "Cache cleared"},
          "400": {"$ref": "#/components/responses/Error400"},
          "401": {"$ref": "#/components/responses/Error401"},
          "403": {"$ref": "#/components/responses/Error403"},
          "502": {"$ref": "#/components/responses/Error502"}
        }
      }
    },
