      "desktopBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Desktop bootstrap token, loopback only."
      }
    },
    "parameters": {
      "limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 50,
          "default": 24
        },
        "description": "Page size."
      },
      "cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "description": "Opaque continuation cursor."
      },
      "csrf": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "Required for mutations; supplied by capabilities or desktop bootstrap. Web mutations additionally require a matching Origin."
      }
    },
