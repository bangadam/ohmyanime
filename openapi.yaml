    "/api/v1/auth/google/start": {
      "get": {
        "operationId": "startGoogleSignIn",
        "description": "Begins the Google authorization-code flow with PKCE. Web clients navigate here and are redirected to Google. Desktop shells call it with the bootstrap capability and receive a URL to open in the system browser plus handoff and poll tokens.",
        "parameters": [
          {
            "name": "return",
            "in": "query",
            "required": false,
            "description": "Application path to return to after sign-in. Absolute and protocol-relative values are reduced to /.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Desktop only: URL to open and the tokens needed to claim the session.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "url": {
                          "type": "string"
                        },
                        "handoff": {
                          "type": "string"
                        },
                        "pollToken": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "url",
                        "handoff",
                        "pollToken"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "data",
                    "requestId"
                  ]
                }
              }
            }
          },
          "302": {
            "description": "Web only: redirect to Google's consent screen."
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "security": []
      }
    },
    "/api/v1/auth/google/callback": {
      "get": {
        "operationId": "googleSignInCallback",
        "description": "Google redirects here. The state, PKCE verifier, ID-token audience, verified email and allowlist are all checked before a session is created. Web sessions are set as an HTTP-only cookie; desktop sessions are held until the shell claims them.",
        "parameters": [
          {
            "name": "state",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "error",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Desktop only: HTML confirmation page; the shell claims the session separately."
          },
          "303": {
            "description": "Web: redirect back to the application with ?auth=ok, denied, not_allowed, expired or failed."
          }
        },
        "security": []
      }
    },
    "/api/v1/auth/google/claim": {
      "post": {
        "operationId": "claimDesktopSignIn",
        "description": "Desktop only. Exchanges the handoff and poll tokens for the finished session, exactly once.",
        "responses": {
          "200": {
            "description": "Session ready.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "authenticated": {
                          "type": "boolean"
                        },
                        "apiToken": {
                          "type": "string",
                          "description": "Session token the shell sends as a bearer credential."
                        },
                        "csrfToken": {
                          "type": "string"
                        },
                        "email": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "authenticated",
                        "apiToken",
                        "csrfToken",
                        "email"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "data",
                    "requestId"
                  ]
                }
              }
            }
          },
          "202": {
            "description": "Sign-in still in progress in the browser."
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          }
        },
        "security": []
      }
    },
