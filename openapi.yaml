              "type": "string"
            }
          },
          {
            "name": "genre",
            "in": "query",
            "description": "Genre filter. Repeat the parameter or pass a comma-separated list; entries are ANDed.",
            "style": "form",
            "explode": true,
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          },
          {
            "name": "tag",
            "in": "query",
            "description": "Tag filter. Repeat the parameter or pass a comma-separated list; entries are ANDed.",
            "style": "form",
            "explode": true,
            "schema": {
              "type": "array",
              "items": {
                "type": "string"
              }
            }
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "releasing",
                "finished",
                "not_yet_released",
                "cancelled",
                "hiatus"
              ]
            }
          },
          {
            "name": "type",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "tv",
                "tv_short",
                "movie",
                "special",
                "ova",
                "ona",
                "music"
              ]
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "popular",
                "trending",
                "score",
                "newest",
                "updated",
                "title_asc",
                "title_desc"
              ],
              "default": "popular"
            }
          },
          {
            "name": "season",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "year",
            "in": "query",
            "schema": {
              "type": "integer"
            }
          },
          {
            "$ref": "#/components/parameters/cursor"
          },
          {
            "$ref": "#/components/parameters/limit"
